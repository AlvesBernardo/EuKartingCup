<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏁 EU Karting Cup 2025</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<!-- Configuration -->
<script>
    const SHEET_ID = '1XLzkFX2NsoXBOcr-FUtDzbHcLVYQv8uYqtlzyQJluMo';
    const DRIVERS_SHEET = 'Drivers';
    const RACES_SHEET = 'Races';
    const NEXTRACES_SHEET = 'NextRaces';
    const RESULTS_SHEET = 'Results';
</script>

<div id="app">
    <!-- Header -->
    <div class="header">
        <img src="logo-removebg-preview.png" alt="EU Karting Cup" class="logo">
        <p class="subtitle">Where friendships go to die on the track</p>
        <div id="nextRace" class="next-race-badge">
            Loading next race...
        </div>
    </div>

    <!-- Navigation -->
    <div class="nav">
        <button onclick="showTab('standings')" id="tab-standings" class="nav-btn active">🏆 Standings</button>
        <button onclick="showTab('stats')" id="tab-stats" class="nav-btn">📊 Stats</button>
        <button onclick="showTab('races')" id="tab-races" class="nav-btn">🏎️ Races</button>
        <button onclick="showTab('awards')" id="tab-awards" class="nav-btn">🥇 Awards</button>
        <button onclick="showTab('nextraces')" id="tab-nextraces" class="nav-btn">📅 Calendar</button>
    </div>

    <!-- Loading State -->
    <div id="loading" class="loading">
        <div class="spinner">🏎️</div>
        <p>Loading data...</p>
    </div>

    <!-- Error State -->
    <div id="error" class="error hidden">
        <div class="icon">⚠️</div>
        <p>Couldn't load data from Google Sheets</p>
        <p class="hint">Make sure you've published the sheet</p>
    </div>

    <!-- Standings Tab -->
    <div id="content-standings" class="tab-content">
        <div id="podium" class="podium"></div>
        <div class="standings-table">
            <div class="standings-header">
                <div>#</div>
                <div>Driver</div>
                <div class="text-center">Points</div>
                <div class="text-center">Wins</div>
                <div class="text-center">Podiums</div>
            </div>
            <div id="standings-list"></div>
        </div>
    </div>

    <!-- Stats Tab -->
    <div id="content-stats" class="tab-content">
        <div class="chart-container">
            <h2>📈 Championship Progression</h2>
            <canvas id="progressionChart"></canvas>
        </div>
        <div class="stats-grid" id="stats-grid"></div>
    </div>

    <!-- Races Tab -->
    <div id="content-races" class="tab-content">
        <div id="races-list"></div>
    </div>

    <!-- Awards Tab -->
    <div id="content-awards" class="tab-content">
        <div id="awards-list" class="awards-grid"></div>
    </div>

    <!-- Next Races Tab -->
    <div id="content-nextraces" class="tab-content">
        <div id="nextraces-list"></div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <img src="logo.png" alt="EU Karting Cup" class="logo-small">
        <p>May the fastest friend win (and the slowest buy drinks) 🍺</p>
        <button onclick="loadAllData()" class="refresh">↻ Refresh Data</button>
    </div>
</div>

<script>
    // Data storage
    let drivers = [];
    let races = [];
    let nextRaces = [];
    let results = [];
    let chart = null;

    // Points system
    const POINTS = [25, 18, 15, 12, 10, 8, 6, 4, 2, 1];

    // Driver colors for chart (brand-inspired)
    const DRIVER_COLORS = [
        '#EF8354', '#4F5D75', '#3B82F6', '#22C55E', '#F59E0B',
        '#EC4899', '#8B5CF6', '#06B6D4', '#EF4444', '#84CC16',
        '#F97316', '#14B8A6', '#6366F1', '#D946EF'
    ];

    // Fetch CSV from Google Sheets
    async function fetchSheet(sheetName) {
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
        const response = await fetch(url);
        if (!response.ok) throw new Error('Failed to fetch');
        const text = await response.text();
        return parseCSV(text);
    }

    // Parse CSV to array of objects
    function parseCSV(csv) {
        const lines = csv.split('\n').filter(line => line.trim());
        if (lines.length < 2) return [];
        const headers = parseCSVLine(lines[0]);
        const data = [];
        for (let i = 1; i < lines.length; i++) {
            const values = parseCSVLine(lines[i]);
            const obj = {};
            headers.forEach((header, idx) => {
                let val = values[idx] || '';
                if (/^-?\d+\.?\d*$/.test(val)) val = parseFloat(val);
                obj[header.trim()] = val;
            });
            data.push(obj);
        }
        return data;
    }

    function parseCSVLine(line) {
        const result = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
            const char = line[i];
            if (char === '"') inQuotes = !inQuotes;
            else if (char === ',' && !inQuotes) {
                result.push(current.trim());
                current = '';
            } else current += char;
        }
        result.push(current.trim());
        return result;
    }

    // Calculate days until date
    function daysUntil(dateStr) {
        if (!dateStr) return NaN;
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        let raceDate;
        if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
            const [y, m, d] = dateStr.split('-');
            raceDate = new Date(y, m - 1, d);
        } else if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(dateStr)) {
            const [d, m, y] = dateStr.split('/');
            raceDate = new Date(y, m - 1, d);
        } else {
            raceDate = new Date(dateStr);
        }
        if (isNaN(raceDate.getTime())) return NaN;
        return Math.ceil((raceDate - today) / (1000 * 60 * 60 * 24));
    }

    // Load all data
    async function loadAllData() {
        document.getElementById('loading').classList.remove('hidden');
        document.getElementById('error').classList.add('hidden');
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));

        try {
            drivers = await fetchSheet(DRIVERS_SHEET);
            drivers.sort((a, b) => (b.Points || 0) - (a.Points || 0));

            try { races = await fetchSheet(RACES_SHEET); } catch (e) { races = []; }
            try { nextRaces = await fetchSheet(NEXTRACES_SHEET); } catch (e) { nextRaces = []; }
            try { results = await fetchSheet(RESULTS_SHEET); } catch (e) { results = []; }

            document.getElementById('loading').classList.add('hidden');
            renderAll();
            showTab('standings');
        } catch (err) {
            console.error(err);
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error').classList.remove('hidden');
        }
    }

    function renderAll() {
        renderPodium();
        renderStandings();
        renderRaces();
        renderAwards();
        renderNextRaces();
        renderStats();
        updateNextRaceHeader();
    }

    function updateNextRaceHeader() {
        const header = document.getElementById('nextRace');
        if (nextRaces.length > 0) {
            const next = nextRaces[0];
            const days = daysUntil(next.Date);
            if (!isNaN(days) && days >= 0) {
                header.innerHTML = `🏁 Next Race: ${next.Location || next.RaceName} in ${days} day${days !== 1 ? 's' : ''}`;
            } else {
                header.innerHTML = '🏁 Check calendar for upcoming races';
            }
        } else {
            header.innerHTML = '🏁 No upcoming races scheduled';
        }
    }

    function renderPodium() {
        const podium = document.getElementById('podium');
        if (drivers.length < 3) {
            podium.innerHTML = '<p style="color:#9ca3af">Need at least 3 drivers</p>';
            return;
        }
        const pos = [
            { d: drivers[1], cls: 'silver', p: '2nd' },
            { d: drivers[0], cls: 'gold first', p: '1st' },
            { d: drivers[2], cls: 'bronze', p: '3rd' }
        ];
        podium.innerHTML = pos.map(x => `
      <div class="podium-place ${x.cls.includes('first') ? 'first' : ''}">
        <div class="emoji">${x.d.Emoji || '🏎️'}</div>
        <div class="podium-stand ${x.cls.split(' ')[0]}">
          <span class="position">${x.p}</span>
          <span class="name">${x.d.Name || 'Unknown'}</span>
          <span class="points">${x.d.Points || 0} pts</span>
        </div>
      </div>
    `).join('');
    }

    function renderStandings() {
        const list = document.getElementById('standings-list');
        list.innerHTML = drivers.map((d, i) => `
      <div class="standings-row">
        <div class="pos" style="color:${DRIVER_COLORS[i % DRIVER_COLORS.length]}">${i + 1}</div>
        <div class="driver">
          <span class="emoji">${d.Emoji || '🏎️'}</span>
          <div>
            <div class="name">${d.Name || 'Unknown'}</div>
            ${d.Nickname ? `<div class="nickname">"${d.Nickname}"</div>` : ''}
          </div>
        </div>
        <div class="points">${d.Points || 0}</div>
        <div class="wins">${d.Wins || 0}</div>
        <div class="podiums">${d.Podiums || 0}</div>
      </div>
    `).join('');
    }

    function renderRaces() {
        const list = document.getElementById('races-list');
        if (races.length === 0) {
            list.innerHTML = '<p class="text-center" style="color:#9ca3af">No races yet</p>';
            return;
        }
        list.innerHTML = races.map(r => `
      <div class="race-card">
        <div class="header">
          <h3>${r.RaceName || 'Race'}</h3>
          <span class="date">${r.Date || ''}</span>
        </div>
        <div class="results">
          <div class="result first"><span class="medal">🥇</span><span class="name">${r.P1 || '-'}</span></div>
          <div class="result"><span class="medal">🥈</span><span>${r.P2 || '-'}</span></div>
          <div class="result"><span class="medal">🥉</span><span>${r.P3 || '-'}</span></div>
          ${r.FastestLap ? `<div class="fastest-lap">⚡ ${r.FastestLap}</div>` : ''}
        </div>
      </div>
    `).join('');
    }

    function renderAwards() {
        const list = document.getElementById('awards-list');
        const awards = [];
        if (drivers.length > 0) {
            const mostWins = [...drivers].sort((a, b) => (b.Wins || 0) - (a.Wins || 0))[0];
            if (mostWins.Wins > 0) awards.push({ title: 'Race Winner', desc: 'Most Wins', winner: mostWins.Name, emoji: '🏆', color: '#eab308' });

            const mostPodiums = [...drivers].sort((a, b) => (b.Podiums || 0) - (a.Podiums || 0))[0];
            if (mostPodiums.Podiums > 0) awards.push({ title: 'Podium King', desc: 'Most Podiums', winner: mostPodiums.Name, emoji: '🎖️', color: '#f97316' });

            const mostFL = [...drivers].sort((a, b) => (b.FastestLaps || 0) - (a.FastestLaps || 0))[0];
            if (mostFL.FastestLaps > 0) awards.push({ title: 'Speed Demon', desc: 'Most Fastest Laps', winner: mostFL.Name, emoji: '⚡', color: '#8b5cf6' });

            const mostDNF = [...drivers].sort((a, b) => (b.DNFs || 0) - (a.DNFs || 0))[0];
            if (mostDNF.DNFs > 0) awards.push({ title: 'Crash King', desc: 'Most DNFs', winner: mostDNF.Name, emoji: '💥', color: '#ef4444' });

            awards.push({ title: 'Championship Leader', desc: 'Most Points', winner: drivers[0].Name, emoji: '👑', color: '#22c55e' });
        }
        if (awards.length === 0) {
            list.innerHTML = '<p class="text-center" style="color:#9ca3af">Awards will appear after races</p>';
            return;
        }
        list.innerHTML = awards.map(a => `
      <div class="award-card">
        <div class="icon" style="background:${a.color}20;border:2px solid ${a.color}">${a.emoji}</div>
        <div class="title">${a.title}</div>
        <div class="desc">${a.desc}</div>
        <div class="winner">👑 ${a.winner}</div>
      </div>
    `).join('');
    }

    function renderNextRaces() {
        const list = document.getElementById('nextraces-list');
        if (nextRaces.length === 0) {
            list.innerHTML = '<p class="text-center" style="color:#9ca3af">No upcoming races</p>';
            return;
        }
        list.innerHTML = nextRaces.map(r => {
            const days = daysUntil(r.Date);
            let countdown = '', cls = '';
            if (isNaN(days)) { countdown = r.Date || 'TBD'; }
            else if (days < 0) { countdown = 'Completed'; cls = ''; }
            else if (days === 0) { countdown = '🔴 TODAY!'; cls = 'today'; }
            else if (days <= 7) { countdown = `${days} day${days !== 1 ? 's' : ''} away`; cls = 'soon'; }
            else { countdown = `${days} days away`; }
            return `
        <div class="next-race-card">
          <div class="top">
            <div>
              <div class="name">${r.RaceName || 'Race'}</div>
              <div class="location">${r.Location || ''}</div>
            </div>
            <div>
              <div class="date">${r.Date || ''}</div>
              <div class="countdown ${cls}">${countdown}</div>
            </div>
          </div>
          ${r.Price ? `<div class="price">💰 ${r.Price}</div>` : ''}
          ${r.Time ? `<div class="time">🕐 ${r.Time}</div>` : ''}
          ${r.Notes ? `<div class="notes">${r.Notes}</div>` : ''}
        </div>
      `;
        }).join('');
    }

    function renderStats() {
        // Season stats
        const grid = document.getElementById('stats-grid');
        const totalRaces = results.length || 0;
        const totalDrivers = drivers.length;

        grid.innerHTML = `
      <div class="stat-card"><div class="icon">🏁</div><div class="value">${totalRaces}</div><div class="label">Races</div></div>
      <div class="stat-card"><div class="icon">👥</div><div class="value">${totalDrivers}</div><div class="label">Drivers</div></div>
      <div class="stat-card"><div class="icon">🏆</div><div class="value">${drivers[0]?.Name || '-'}</div><div class="label">Leader</div></div>
      <div class="stat-card"><div class="icon">📊</div><div class="value">${drivers[0]?.Points || 0}</div><div class="label">Top Points</div></div>
    `;

        // Chart
        renderChart();
    }

    function renderChart() {
        if (!results || results.length === 0) {
            document.getElementById('progressionChart').parentElement.innerHTML = '<p class="text-center" style="color:#9ca3af;padding:2rem;">Add race results to see the chart</p>';
            return;
        }

        const ctx = document.getElementById('progressionChart').getContext('2d');

        // Calculate points per driver per race from Results sheet
        const raceNames = results.map(r => r.Race);
        const driverPoints = {};

        // Initialize all drivers
        drivers.forEach(d => {
            driverPoints[d.Name] = [];
        });

        // Calculate points for each race
        results.forEach(race => {
            // Get positions P1-P13 (or however many)
            const positions = [];
            for (let i = 1; i <= 20; i++) {
                const pos = race[`P${i}`];
                if (pos && pos.trim()) positions.push(pos.trim());
            }

            // Assign points
            const racePoints = {};
            positions.forEach((driverName, idx) => {
                const pts = idx < POINTS.length ? POINTS[idx] : 0;
                racePoints[driverName] = pts;
            });

            // Add fastest lap bonus (+1 if in top 10)
            if (race.FastestLap && racePoints[race.FastestLap] !== undefined) {
                racePoints[race.FastestLap] += 1;
            }

            // Add to each driver's array
            Object.keys(driverPoints).forEach(name => {
                driverPoints[name].push(racePoints[name] || 0);
            });
        });

        // Calculate cumulative points and sort by total
        const driverTotals = Object.entries(driverPoints).map(([name, pts]) => ({
            name,
            points: pts,
            total: pts.reduce((a, b) => a + b, 0)
        })).sort((a, b) => b.total - a.total);

        // Only show top 8 in chart
        const topDrivers = driverTotals.slice(0, 8);

        const datasets = topDrivers.map((driver, i) => {
            const cumulative = [];
            let total = 0;
            driver.points.forEach(p => {
                total += p;
                cumulative.push(total);
            });

            return {
                label: driver.name,
                data: cumulative,
                borderColor: DRIVER_COLORS[i],
                backgroundColor: DRIVER_COLORS[i],
                tension: 0.3,
                pointRadius: 4,
                pointHoverRadius: 6
            };
        });

        if (chart) chart.destroy();

        chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: raceNames,
                datasets: datasets
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: { color: '#9ca3af', usePointStyle: true }
                    }
                },
                scales: {
                    x: { ticks: { color: '#9ca3af' }, grid: { color: '#374151' } },
                    y: { ticks: { color: '#9ca3af' }, grid: { color: '#374151' }, beginAtZero: true }
                }
            }
        });
    }

    function showTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`content-${tabName}`).classList.add('active');
        document.getElementById(`tab-${tabName}`).classList.add('active');
    }

    // Initialize
    loadAllData();
</script>
</body>
</html>
